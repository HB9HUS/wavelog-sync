rigs:
- name: FT710
  address: 127.0.0.1:4532
  # scale the power read from rigctl by this factor
  # rigctl sends a value from 0.0..1.0
  power_scale: 100
  # enable power sending, not all rigs can send power
  send_power: true
wavelog:
  address: https://log.mydomain.com/index.php/api/v2/radio
  # a v2 API token (starts with wl2_), generated under Admin -> API in Wavelog.
  # v1 tokens are not accepted on the v2 endpoint.
  token: wl2_YOUR-WAVELOG-V2-TOKEN
